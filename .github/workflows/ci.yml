name: Intégration continue

on:
 push:
   branches:
     - main

jobs:
 test:
   runs-on: ubuntu-latest
   steps:
     - name: Récupérer le code
       uses: actions/checkout@v4

     - name: Vérifier le projet
       run: ls -la

     - name: Construire l'image Docker
       run: docker build -t devops-app .

     - name: Démarrer le conteneur
       run: docker run -d --name devops-app-test -p 8081:8080 devops-app

     - name: Voir les logs du conteneur
       run: docker logs devops-app-test

     - name: Tester l'application
       run: curl http://localhost:8081

     - name: Vérifier la réponse
       run: |
         reponse=$(curl -s http://localhost:8081)
         test "$reponse" = "Bonjour depuis mon application DevOps !"

